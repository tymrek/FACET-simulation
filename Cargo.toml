[package]
name = "facet-sim"
version = "0.7.0"
edition = "2021"
rust-version = "1.79"
description = "FACET constellation simulator: an Earth-centred planetarium with a scalable telescope shell"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.27"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
rustfft = "6"
rayon = "1"
rodio = { version = "0.21", optional = true }

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 2

[features]
default = ["audio"]
# Presentation narration playback (needs ALSA headers on Linux: libasound2-dev).
audio = ["dep:rodio"]
