<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FACET simulator</title>
<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0B1424; color: #c9d4e3; font: 14px system-ui, sans-serif; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
             background: #0B1424; transition: opacity .5s ease; z-index: 2; }
  #loading.done { opacity: 0; pointer-events: none; }
  #title { font: 700 26px 'Space Grotesk', system-ui, sans-serif; letter-spacing: .12em; color: #e3efff; }
  #sub { margin-top: -10px; font-size: 13px; color: #a9c8f5; letter-spacing: .02em; }
  #stage { min-height: 1.2em; }
  #bar { width: min(320px, 70vw); height: 6px; border-radius: 3px; background: #1b2433; overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, #3d7bd8, #7fc3ff); transition: width .15s linear; }
  #bar.indeterminate #fill { width: 35%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  #hint { opacity: .55; font-size: 12px; text-align: center; max-width: 80vw; }
  #err { color: #ff8a80; max-width: 80vw; text-align: center; }
</style>
</head>
<body>
<canvas id="facet_canvas"></canvas>
<div id="loading">
  <svg id="gem" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="FACET gem mark"></svg>
  <div id="title">FACET</div>
  <div id="sub">simulator</div>
  <div id="stage">Downloading…</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="hint">Options in the address: ?n=10000&amp;mode=allsky&amp;twins</div>
  <div id="err" hidden></div>
</div>
<script type="module">
  import init from "./facet-sim.js";
  const $ = (id) => document.getElementById(id);
  // The FACET gem (logo motion study B <-> C): a brilliant cut seen from
  // above, tipping to profile while light runs down through the table to
  // the culet, then back. Plain SVG, so it costs no download.
  const GEM = (() => {
    const V = [], F = [], d = Math.PI / 180, T = [], S = [], G = [], L = [];
    const P = (r, a, y) => (V.push([r * Math.cos(a), y, r * Math.sin(a)]), V.length - 1);
    for (let k = 0; k < 8; k++) T.push(P(0.56, 45 * k * d, 0.30));
    for (let k = 0; k < 8; k++) S.push(P(0.80, (45 * k + 22.5) * d, 0.17));
    for (let j = 0; j < 16; j++) G.push(P(1.0, 22.5 * j * d, 0.0));
    for (let k = 0; k < 8; k++) L.push(P(0.52, 45 * k * d, -0.48));
    const cul = P(0, 0, -0.86);
    F.push({ v: T.slice(), table: true });
    for (let k = 0; k < 8; k++) {
      const k1 = (k + 1) % 8, km = (k + 7) % 8;
      F.push({ v: [T[k], T[k1], S[k]] }, { v: [T[k], S[km], G[2 * k], S[k]] },
             { v: [S[k], G[2 * k], G[2 * k + 1]] }, { v: [S[k], G[2 * k + 1], G[(2 * k + 2) % 16]] },
             { v: [G[2 * k + 1], G[2 * k], L[k]] }, { v: [G[(2 * k + 2) % 16], G[2 * k + 1], L[k1]] },
             { v: [L[k], G[2 * k + 1], L[k1]] }, { v: [L[k1], cul, L[k]] });
    }
    return { V, F, cul };
  })();
  const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const mix = (a, b, t) => { t = Math.max(0, Math.min(1, t)); const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t))})`; };
  const ease = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
  const STARS = [[-14, -10, 2.6], [12, -18, 1.6], [18, 10, 2.0], [-6, 16, 1.4], [2, -2, 1.1], [-22, 6, 1.2]];
  const LIGHT = [-0.45, 0.6, 0.66];
  function gemSvg(t) {
    const u = (t % 10);                       // 10 s cycle
    const tilt = u < 2.5 ? 0 : u < 4.5 ? ease((u - 2.5) / 2) : u < 8 ? 1 : ease(1 - (u - 8) / 2);
    const spin = t * 0.12, a = (1 - tilt) * Math.PI / 2;
    const ca = Math.cos(a), sa = Math.sin(a), cs = Math.cos(spin), ss = Math.sin(spin);
    const Sc = 86, cx = 100, cy = 100 + 14 * tilt;
    const W = GEM.V.map(([x0, y, z0]) => { const x = x0 * cs - z0 * ss, z = x0 * ss + z0 * cs; return [x, y * ca - z * sa, y * sa + z * ca]; });
    const polys = [];
    for (const f of GEM.F) {
      const p = f.v.map((i) => W[i]);
      const u1 = [0, 1, 2].map((i) => p[1][i] - p[0][i]), w = [0, 1, 2].map((i) => p[2][i] - p[0][i]);
      let n = [u1[1] * w[2] - u1[2] * w[1], u1[2] * w[0] - u1[0] * w[2], u1[0] * w[1] - u1[1] * w[0]];
      const m = Math.hypot(...n) || 1; n = n.map((v) => v / m);
      const c = [0, 1, 2].map((i) => p.reduce((s, q) => s + q[i], 0) / p.length);
      if (n[0] * c[0] + n[1] * c[1] + n[2] * c[2] < 0) n = n.map((v) => -v);
      if (n[2] <= 0.001) continue;            // back face
      const lam = Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
      const fill = f.table ? mix("#0d2347", "#2c5aa0", tilt * 0.9) : mix("#173a6e", "#cfe2ff", 0.1 + 0.9 * Math.pow(lam, 1.3));
      polys.push([c[2], `<polygon points="${p.map((q) => `${(cx + Sc * q[0]).toFixed(1)},${(cy - Sc * q[1]).toFixed(1)}`).join(" ")}" fill="${fill}" stroke="#0B1424" stroke-width="1.1" stroke-linejoin="round"/>`]);
    }
    polys.sort((x, y) => x[0] - y[0]);
    let out = polys.map((x) => x[1]).join("");
    const cu = W[GEM.cul], cux = cx + Sc * cu[0], cuy = cy - Sc * cu[1];
    const starO = Math.max(0, 1 - tilt * 2.2);
    STARS.forEach(([x, y, r], i) => {
      const o = starO * (0.65 + 0.35 * Math.sin(t * 2.1 + i * 1.7));
      if (o > 0.01) out += `<circle cx="${100 + x * (1 - 0.6 * tilt)}" cy="${100 + y * (1 - tilt)}" r="${r}" fill="#e3efff" fill-opacity="${o.toFixed(2)}"/>`;
    });
    const ray = u < 4.5 ? 0 : u < 6 ? ease((u - 4.5) / 1.5) : u < 8 ? 1 : 1 - ease((u - 8) / 1);
    if (ray > 0) {
      const tableY = cy - Sc * 0.30, ra = Math.min(1, ray * 2), rb = Math.max(0, ray * 2 - 1);
      for (const k of [-0.42, -0.21, 0, 0.21, 0.42]) {
        const x = 100 + Sc * k;
        out += `<line x1="${x}" y1="8" x2="${x}" y2="${8 + (tableY - 8) * ra}" stroke="#e3efff" stroke-opacity="${(0.9 * Math.min(1, ray * 1.5)).toFixed(2)}" stroke-width="1.6" stroke-linecap="round"/>`;
        if (rb > 0) out += `<line x1="${x}" y1="${tableY}" x2="${x + (cux - x) * rb}" y2="${tableY + (cuy - 6 - tableY) * rb}" stroke="#e3efff" stroke-opacity="${(0.55 * rb).toFixed(2)}" stroke-width="1.2" stroke-linecap="round"/>`;
      }
    }
    const g = u < 5.5 ? 0 : u < 6.2 ? (u - 5.5) / 0.7 : u < 8 ? 1 : Math.max(0, 1 - (u - 8) / 0.8);
    if (g > 0) out += `<circle cx="${cux}" cy="${cuy - 6}" r="${(2 + 4 * g + 0.8 * Math.sin(t * 5) * g).toFixed(2)}" fill="#e3efff" fill-opacity="${g.toFixed(2)}"/>`;
    return out;
  }
  // Start a little before the tip so the light arrives while the download runs.
  const svg = $("gem"), t0 = performance.now() - 1500;
  let raf = 0;
  const frame = (now) => { svg.innerHTML = gemSvg((now - t0) / 1000); raf = requestAnimationFrame(frame); };
  raf = requestAnimationFrame(frame);
  const mb = (b) => (b / 1048576).toFixed(1);
  async function download(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
    // Content-Length is the compressed size when the server gzips; then the
    // bar shows activity only.
    const enc = r.headers.get("content-encoding");
    const total = enc ? 0 : +r.headers.get("content-length") || 0;
    if (!total) $("bar").classList.add("indeterminate");
    const reader = r.body.getReader();
    const parts = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); got += value.length;
      $("stage").textContent = total ? `Downloading ${mb(got)} of ${mb(total)} MB` : `Downloading ${mb(got)} MB`;
      if (total) $("fill").style.width = `${Math.min(100, 100 * got / total)}%`;
    }
    const buf = new Uint8Array(got); let o = 0;
    for (const p of parts) { buf.set(p, o); o += p.length; }
    return buf;
  }
  try {
    const bytes = await download("facet-sim_bg.wasm");
    $("bar").classList.add("indeterminate");
    $("stage").textContent = "Starting the simulator…";
    await init({ module_or_path: bytes });
    $("stage").textContent = "Building the sky…";
    // Keep the overlay until the app has drawn: eframe sizes the canvas on its
    // first frame (the browser default is 300 × 150).
    const c = $("facet_canvas");
    await new Promise((res) => { const t = setInterval(() => { if (c.width !== 300 || c.height !== 150) { clearInterval(t); res(); } }, 100); });
    $("loading").classList.add("done");
    setTimeout(() => { cancelAnimationFrame(raf); $("loading").remove(); }, 600);
  } catch (e) {
    console.error(e);
    $("stage").textContent = "Could not start the simulator.";
    $("err").hidden = false;
    $("err").textContent = String(e);
    $("bar").hidden = true;
  }
</script>
</body>
</html>
