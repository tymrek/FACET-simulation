name: Windows

on:
  push:
    branches: [windows, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # the "windows-test" pre-release below
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (default features, with audio)
        run: cargo build --release --locked
      - name: Check the .exe needs no Visual C++ runtime DLLs
        shell: pwsh
        run: |
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("target/release/facet-sim.exe"))
          $bad = [regex]::Matches($text, '(?i)(vcruntime|msvcp|ucrtbase)[0-9_]*\.dll|api-ms-win-crt-[a-z0-9-]+\.dll') | ForEach-Object Value | Sort-Object -Unique
          if ($bad) { throw "facet-sim.exe still imports: $($bad -join ', ')" }
          Write-Host "No Visual C++ runtime imports."
      - name: Tests
        run: cargo test --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/facet-sim.exe dist/
          Copy-Item windows/README.txt dist/
          Copy-Item CHANGELOG.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: facet-sim-windows
          path: dist/
      # The runner has no GPU OpenGL, so run the smoke test on Mesa's
      # software renderer (llvmpipe) placed beside a copy of the .exe. The
      # uploaded build above does not include it.
      - name: Smoke test (software OpenGL)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GALLIUM_DRIVER: llvmpipe
        run: |
          New-Item -ItemType Directory smoke | Out-Null
          gh release download --repo pal1000/mesa-dist-win --pattern "mesa3d-*-release-msvc.7z" --dir smoke
          7z x -osmoke/mesa (Get-ChildItem smoke/*.7z).FullName | Out-Null
          Copy-Item smoke/mesa/x64/*.dll smoke/
          Copy-Item target/release/facet-sim.exe smoke/
          $p = Start-Process -FilePath smoke/facet-sim.exe -WorkingDirectory smoke -PassThru `
                 -RedirectStandardError smoke/stderr.txt -RedirectStandardOutput smoke/stdout.txt
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 2
            if ($p.HasExited) { break }
            try { $s = Invoke-RestMethod http://127.0.0.1:8781/api/status -TimeoutSec 5 } catch { $s = $null }
            if ($s -and $s.build) { $ok = $true; break }
          }
          if ($ok) {
            Write-Host "Public page up: build $($s.build), $($s.mode_label), sim time $($s.utc)"
            Start-Sleep 20
            $s2 = Invoke-RestMethod http://127.0.0.1:8781/api/status -TimeoutSec 5
            Write-Host "After 20 s: sim time $($s2.utc), playing $($s2.playing)"
            if ($s2.jd -le $s.jd) { throw "simulation clock did not advance" }
            $c = Invoke-WebRequest http://127.0.0.1:8780/ -UseBasicParsing -TimeoutSec 5
            Write-Host "Control page: HTTP $($c.StatusCode), $($c.Content.Length) bytes"
            $q = Invoke-WebRequest http://127.0.0.1:8781/ -UseBasicParsing -TimeoutSec 5
            Write-Host "Public page: HTTP $($q.StatusCode), $($q.Content.Length) bytes"
          }
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          Get-Content smoke/stderr.txt -Tail 40 -ErrorAction SilentlyContinue
          if (-not $ok -or -not $alive) { throw "facet-sim did not come up (or exited) on Windows" }
      # Test builds from the windows branch go to one rolling pre-release, so
      # testers can download without a GitHub account:
      # https://github.com/tymrek/FACET-simulation/releases/tag/windows-test
      - name: Publish the "Windows test build" pre-release
        if: github.ref == 'refs/heads/windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/* -DestinationPath facet-sim-windows.zip
          $sha = "${{ github.sha }}".Substring(0, 7)
          $notes = @"
          Test build of the FACET simulator for Windows (64-bit), from the windows branch at $sha.
          Not a release. Replaced by each new test build.

          Download facet-sim-windows.zip below (facet-sim.exe plus README.txt with first-run steps and a test checklist), or facet-sim.exe on its own.
          "@
          gh release delete windows-test --cleanup-tag --yes 2>$null
          gh release create windows-test --prerelease --target "${{ github.sha }}" `
            --title "Windows test build ($sha)" --notes $notes `
            facet-sim-windows.zip dist/facet-sim.exe
